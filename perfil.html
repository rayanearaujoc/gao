<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GAO · Meu perfil</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script>try{if(JSON.parse(localStorage.getItem('gao_theme')||'null')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="static/css/app.css">
<link rel="stylesheet" href="static/css/home.css">
<link rel="stylesheet" href="static/css/perfil.css">
</head>
<body class="p-perfil" data-page="perfil" data-crumb="Meu perfil" data-crumb-icon="circle-user-round">

<div class="app">
  <div class="topbar">
    <button class="menu-btn" data-gao-menu><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg> Menu</button>
  </div>

  <div class="content">
    <div class="h-head">
      <h2>Meu perfil</h2>
      <p>Seus dados e a segurança da sua conta</p>
    </div>

    <div class="pf-grid">
      <!-- Dados -->
      <div class="pf-card">
        <div class="pf-id">
          <div class="pf-av">RA</div>
          <div class="pf-id-tx"><b>Ronaldo Araújo</b><small>Motorista</small></div>
        </div>
        <div class="pf-body">
          <label class="pf-label" for="pfNome">Nome completo</label>
          <div class="pf-field">
            <span class="pf-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" stroke-linecap="round"/></svg></span>
            <input type="text" id="pfNome" value="Ronaldo Araújo">
          </div>
          <label class="pf-label" for="pfEmail">E-mail</label>
          <div class="pf-field">
            <span class="pf-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
            <input type="email" id="pfEmail" value="ronaldo.araujo@gao.com.br">
          </div>
          <p class="pf-help">Este e-mail será usado nos comunicados da sua conta.</p>
          <div class="pf-msg" id="dadosMsg"><span class="pf-msg-ic"></span><span class="pf-msg-tx"></span></div>
        </div>
        <div class="pf-foot">
          <button class="pf-btn pri" id="saveDados" type="button">Salvar alterações</button>
        </div>
      </div>

      <!-- Segurança -->
      <div class="pf-card">
        <div class="pf-card-head">
          <div class="pf-head-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
          <div><b>Segurança</b><span>Atualize sua senha de acesso.</span></div>
        </div>
        <div class="pf-body">
          <label class="pf-label" for="curPass">Senha atual</label>
          <div class="pf-field">
            <span class="pf-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="curPass" placeholder="Digite sua senha atual" autocomplete="current-password">
            <button class="pf-eye" type="button" aria-label="Mostrar senha"></button>
          </div>
          <label class="pf-label" for="newPass">Nova senha</label>
          <div class="pf-field">
            <span class="pf-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="newPass" placeholder="Crie uma nova senha" autocomplete="new-password">
            <button class="pf-eye" type="button" aria-label="Mostrar senha"></button>
          </div>
          <label class="pf-label" for="confPass">Confirmar nova senha</label>
          <div class="pf-field">
            <span class="pf-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="confPass" placeholder="Repita a nova senha" autocomplete="new-password">
            <button class="pf-eye" type="button" aria-label="Mostrar senha"></button>
          </div>
          <div class="pf-msg" id="pfMsg"><span class="pf-msg-ic"></span><span class="pf-msg-tx"></span></div>
        </div>
        <button class="pf-btn ghost" id="savePass" type="button">Alterar senha</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.60.0/dist/umd/lucide.min.js"></script>
<script src="static/js/shell.js"></script>
<script>
(function(){
  var EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/></svg>';
  var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var AL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';

  function msg(el,kind,txt){ el.className='pf-msg show '+kind; el.querySelector('.pf-msg-ic').innerHTML=(kind==='ok'?OK:AL); el.querySelector('.pf-msg-tx').textContent=txt; }
  function field(input){ return input.closest('.pf-field'); }

  // mostrar / ocultar senha
  document.querySelectorAll('.pf-eye').forEach(function(btn){
    btn.innerHTML=EYE_OFF;
    btn.addEventListener('click',function(){
      var inp=btn.parentElement.querySelector('input'), show=inp.type==='password';
      inp.type=show?'text':'password';
      btn.innerHTML=show?EYE:EYE_OFF;
      btn.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');
    });
  });

  // dados
  var pfEmail=document.getElementById('pfEmail'), pfNome=document.getElementById('pfNome'), dadosMsg=document.getElementById('dadosMsg');
  [pfEmail,pfNome].forEach(function(i){ i.addEventListener('input',function(){ field(i).classList.remove('err'); dadosMsg.classList.remove('show'); }); });
  document.getElementById('saveDados').addEventListener('click',function(){
    field(pfEmail).classList.remove('err'); field(pfNome).classList.remove('err');
    if(!pfNome.value.trim()){ field(pfNome).classList.add('err'); msg(dadosMsg,'err','Informe o seu nome.'); pfNome.focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(pfEmail.value.trim())){ field(pfEmail).classList.add('err'); msg(dadosMsg,'err','Informe um e-mail válido.'); pfEmail.focus(); return; }
    msg(dadosMsg,'ok','Dados salvos com sucesso.');
  });

  // senha
  var cur=document.getElementById('curPass'), nw=document.getElementById('newPass'), cf=document.getElementById('confPass'), pfMsg=document.getElementById('pfMsg');
  [cur,nw,cf].forEach(function(i){ i.addEventListener('input',function(){ field(i).classList.remove('err'); pfMsg.classList.remove('show'); }); });
  document.getElementById('savePass').addEventListener('click',function(){
    [cur,nw,cf].forEach(function(i){ field(i).classList.remove('err'); });
    if(!cur.value){ field(cur).classList.add('err'); msg(pfMsg,'err','Digite sua senha atual.'); cur.focus(); return; }
    if(nw.value.length<8){ field(nw).classList.add('err'); msg(pfMsg,'err','A nova senha precisa ter pelo menos 8 caracteres.'); nw.focus(); return; }
    if(nw.value!==cf.value){ field(cf).classList.add('err'); msg(pfMsg,'err','A confirmação não confere com a nova senha.'); cf.focus(); return; }
    cur.value=''; nw.value=''; cf.value='';
    msg(pfMsg,'ok','Senha alterada com sucesso.');
  });
})();
</script>
</body>
</html>
