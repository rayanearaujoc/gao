<!-- formulário -->
<div class="lg-rt">
  <main class="lg-main">
    <div class="lg-card">
      <img class="lg-logo" src="static/img/logo.svg" alt="GAO Logística">
      <h1>Entrar</h1>
      <p class="lg-sub">Entre com as credenciais que a GAO disponibilizou.</p>

      <form id="lgForm" novalidate>
        <div class="lg-f">
          <label class="lg-label" for="lgUser">Usuário/E-mail</label>
          <input id="lgUser" type="text" placeholder="Seu usuário" autocomplete="username">
          <div class="lg-msg" id="m1">Informe seu usuário ou e-mail.</div>
        </div>

        <div class="lg-f">
          <label class="lg-label" for="lgPass">Senha</label>
          <div class="lg-w">
            <input id="lgPass" type="password" placeholder="Sua senha" autocomplete="current-password">
            <button class="lg-eye" id="lgEye" type="button" aria-label="Mostrar senha"><i data-lucide="eye"></i></button>
          </div>
          <div class="lg-msg" id="m2">Informe sua senha.</div>
        </div>

        <button type="button" class="lg-forgot" id="lgForgot">Esqueceu a senha?</button>
        <div class="lg-forgot-note" id="lgForgotNote" hidden>Solicite uma nova senha ao responsável da sua operação.</div>

        <button type="submit" class="lg-btn" id="lgGo">Entrar</button>
      </form>
    </div>
  </main>
  <footer class="lg-foot">© 2026 GAO Logística</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  function ic(){ if(window.lucide&&lucide.createIcons) lucide.createIcons(); }
  var pass=document.getElementById('lgPass'), eye=document.getElementById('lgEye');
  eye.addEventListener('click',function(){
    var show=pass.type==='password';
    pass.type=show?'text':'password';
    eye.innerHTML='<i data-lucide="'+(show?'eye-off':'eye')+'"></i>';
    eye.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');
    ic();
  });
  document.getElementById('lgForgot').addEventListener('click',function(){
    document.getElementById('lgForgotNote').hidden=false;
  });
  var user=document.getElementById('lgUser'), m1=document.getElementById('m1'), m2=document.getElementById('m2'), go=document.getElementById('lgGo');
  function submit(){
    var a=!user.value.trim(), b=!pass.value;
    user.classList.toggle('err',a); m1.classList.toggle('on',a);
    pass.classList.toggle('err',b); m2.classList.toggle('on',b);
    if(a||b||go.disabled) return;
    go.disabled=true; go.classList.add('ld'); go.innerHTML='<span class="lg-spin"></span>Entrando';
    setTimeout(function(){ window.location.href='index.html'; },1100);
  }
  document.getElementById('lgForm').addEventListener('submit',function(e){ e.preventDefault(); submit(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  user.addEventListener('input',function(){ user.classList.remove('err'); m1.classList.remove('on'); });
  pass.addEventListener('input',function(){ pass.classList.remove('err'); m2.classList.remove('on'); });
  ic();
</script>
