<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GAO · Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="static/css/app.css">
<link rel="stylesheet" href="static/css/login.css">
</head>
<body class="p-login">

<div class="lg-wrap">
  <!-- painel azul com a arte -->
  <div class="lg-art">
    <img class="lg-art-bg" src="static/img/login-art.svg" alt="">
    <div class="lg-art-foot">
      <b>GAO LOGÍSTICA</b>
    </div>
  </div>

  <!-- formulário -->
  <div class="lg-main">
    <div class="lg-body">
      <div class="lg-card">
        <img class="lg-logo" src="static/img/logo.svg" alt="GAO Logística">
        <h1>Login</h1>
        <p class="lg-sub">Entre com as credenciais que a GAO disponibilizou.</p>

        <form id="lgForm">
          <label class="lg-label" for="lgUser">Usuário/E-mail</label>
          <div class="lg-field">
            <span class="lg-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
            <input type="text" id="lgUser" placeholder="Seu usuário" autocomplete="username">
          </div>

          <label class="lg-label" for="lgPass">Senha</label>
          <div class="lg-field">
            <span class="lg-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="lgPass" placeholder="Sua senha" autocomplete="current-password">
            <button type="button" class="lg-eye" id="lgEye" aria-label="Mostrar senha"></button>
          </div>

          <button type="button" class="lg-forgot" id="lgForgot">Esqueceu a senha?</button>
          <div class="lg-forgot-note" id="lgForgotNote" hidden>Solicite uma nova senha ao responsável da sua operação.</div>

          <button type="submit" class="lg-btn">Entrar</button>
        </form>
      </div>
    </div>

    <div class="lg-foot">
      <span>© 2026 GAO Logística</span>
      <span>Todos os direitos reservados.</span>
    </div>
  </div>
</div>

<script>
  var EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/></svg>';
  var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var eye=document.getElementById('lgEye'), pass=document.getElementById('lgPass');
  eye.innerHTML=EYE_OFF;
  eye.addEventListener('click',function(){
    var show=pass.type==='password';
    pass.type=show?'text':'password';
    eye.innerHTML=show?EYE:EYE_OFF;
    eye.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');
  });
  document.getElementById('lgForgot').addEventListener('click',function(){
    document.getElementById('lgForgotNote').hidden=false;
  });
  document.getElementById('lgForm').addEventListener('submit',function(e){
    e.preventDefault();
    var btn=e.target.querySelector('.lg-btn');
    if(btn.classList.contains('loading')) return;
    btn.classList.add('loading'); btn.disabled=true;
    btn.innerHTML='<span class="lg-spin"></span>Entrando…';
    setTimeout(function(){ window.location.href='index.html'; }, 1000);
  });
</script>
</body>
</html>
