.pi {
    font-family: 'primeicons';
    speak: none;
    font-style: normal;
    font-weight: normal;
    font-variant: normal;
    text-transform: none;
    line-height: 1;
    display: inline-block;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.pi:before {
    --webkit-backface-visibility:hidden;
    backface-visibility: hidden;
}

.pi-fw {
    width: 1.28571429em;
    text-align: center;
}

.pi-spin {
    -webkit-animation: fa-spin 2s infinite linear;
    animation: fa-spin 2s infinite linear;
}

@media (prefers-reduced-motion: reduce) {
  .pi-spin {
    -webkit-animation-delay: -1ms;
    animation-delay: -1ms;
    -webkit-animation-duration: 1ms;
    animation-duration: 1ms;
    -webkit-animation-iteration-count: 1;
    animation-iteration-count: 1;
    -webkit-transition-delay: 0s;
    transition-delay: 0s;
    -webkit-transition-duration: 0s;
    transition-duration: 0s;
  }
}

@-webkit-keyframes fa-spin {
    0% {
        -webkit-transform: rotate(0deg);
        transform: rotate(0deg);
    }
    100% {
        -webkit-transform: rotate(359deg);
        transform: rotate(359deg);
    }
}

@keyframes fa-spin {
    0% {
        -webkit-transform: rotate(0deg);
        transform: rotate(0deg);
    }
    100% {
        -webkit-transform: rotate(359deg);
        transform: rotate(359deg);
    }
}

/* ===== primitivas (palette.css) ===== */
:root{
  --p-primary-50:#eff6ff; --p-primary-200:#bfdbfe; --p-primary-300:#93c5fd; --p-primary-400:#60a5fa;
  --p-primary-600:#2563eb; --p-primary-700:#1d4ed8;
  --p-surface-0:#ffffff; --p-surface-50:#f2f6fc; --p-surface-100:#e9eff7; --p-surface-200:#dfe5ee;
  --p-surface-300:#c5cfdd; --p-surface-400:#8395ad; --p-surface-500:#52657f; --p-surface-600:#3a4b64;
  --p-surface-700:#1f2f48; --p-surface-800:#13223a; --p-surface-900:#0a1628; --p-surface-950:#050b16;
}
html[data-theme="dark"]{
  --p-surface-50:#f3f5f8; --p-surface-100:#e9edf2; --p-surface-200:#dde2ea; --p-surface-300:#c3cbd8;
  --p-surface-400:#98a3b5; --p-surface-500:#6b7688; --p-surface-600:#4b5566; --p-surface-700:#2d3440;
  --p-surface-800:#1e242e; --p-surface-900:#14181f; --p-surface-950:#0a0d12;
}
/* ===== semântica (tokens.css) ===== */
:root{
  --app-canvas:var(--p-surface-50); --app-surface:var(--p-surface-0); --app-sunken:var(--p-surface-50);
  --app-band:var(--p-surface-200); --app-band-active:var(--p-surface-0); --app-hover:var(--p-surface-100);
  --app-border:var(--p-surface-200); --app-border-strong:var(--p-surface-300);
  --app-text:var(--p-surface-900); --app-text-muted:var(--p-surface-500); --app-text-subtle:var(--p-surface-400);
  --app-accent:var(--p-primary-600); --app-accent-strong:var(--p-primary-700);
  --app-accent-soft:var(--p-primary-50); --app-accent-border:var(--p-primary-200); --app-accent-fill:var(--p-primary-600);
  --app-success:#16a34a; --app-success-soft:#f0fdf4; --app-danger:#dc2626; --app-danger-soft:#fef2f2;
  --app-warning:#d97706; --app-warning-soft:#fffbeb; --app-warning-border:#fde68a;
  --app-neutral-soft:var(--p-surface-100);
  --app-shadow-card:0 1px 2px 0 rgb(15 23 42 / .06), 0 1px 3px 0 rgb(15 23 42 / .08);
  --app-shadow-raised:0 10px 30px -12px rgb(15 23 42 / .25);

  /* gráfico do comparativo de estoque (useDashboardChartColors) */
  --c-stock:#0284c7; --c-usage:#059669; --c-unav:#be123c; --c-trend:#f59e0b;
  /* turnos — categórica validada, 3 primeiros slots (todos os pares) */
  --t1:#2a78d6; --t2:#eb6834; --t3:#1baf7a;
  /* comparação "hoje"/"média": mesma cor de tendência do painel */
  --line:#f59e0b;
  --q0:#eef2f7; --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95;
  --grid:#e9eff7;
}
html[data-theme="dark"]{
  --app-canvas:var(--p-surface-950); --app-surface:var(--p-surface-800); --app-sunken:var(--p-surface-900);
  --app-band:var(--p-surface-700); --app-band-active:var(--p-surface-600); --app-hover:var(--p-surface-700);
  --app-border:var(--p-surface-700); --app-border-strong:var(--p-surface-600);
  --app-text:var(--p-surface-50); --app-text-muted:var(--p-surface-400); --app-text-subtle:var(--p-surface-500);
  --app-accent:var(--p-primary-400); --app-accent-strong:var(--p-primary-300);
  --app-accent-soft:color-mix(in srgb, var(--p-primary-400) 16%, transparent);
  --app-accent-border:color-mix(in srgb, var(--p-primary-400) 40%, transparent);
  --app-success:#4ade80; --app-success-soft:color-mix(in srgb,#4ade80 14%,transparent);
  --app-danger:#f87171; --app-danger-soft:color-mix(in srgb,#f87171 14%,transparent);
  --app-warning:#fbbf24; --app-warning-soft:color-mix(in srgb,#fbbf24 12%,transparent); --app-warning-border:color-mix(in srgb,#fbbf24 40%,transparent);
  --app-neutral-soft:var(--p-surface-700);
  --app-shadow-card:0 1px 2px 0 rgb(0 0 0 / .4), 0 1px 3px 0 rgb(0 0 0 / .3);
  --app-shadow-raised:0 10px 30px -12px rgb(0 0 0 / .6);
  --c-trend:#facc15; --line:#facc15;
  --t1:#3987e5; --t2:#d95926; --t3:#199e70;
  --q0:#232a35; --q1:#104281; --q2:#184f95; --q3:#256abf; --q4:#3987e5; --q5:#6da7ec; --q6:#b7d3f6;
  --grid:#2d3440;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--app-canvas);color:var(--app-text);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ===== shell ===== */
.shell{display:flex;min-height:100vh}
.side{width:288px;flex:0 0 288px;background:var(--app-surface);border-right:1px solid var(--app-border);display:flex;flex-direction:column}
.side__brand{display:flex;align-items:center;gap:.75rem;padding:1rem 1rem;border-bottom:1px solid var(--app-border);min-height:68px}
.side__logo{width:36px;height:36px;border-radius:.6rem;display:grid;place-items:center;background:var(--app-accent-soft);color:var(--app-accent);font-size:1.1rem}
.side__brand b{font-size:1.15rem;font-weight:750;letter-spacing:-.01em;flex:1}
.side__nav{padding:1rem .9rem;display:flex;flex-direction:column;gap:.15rem;flex:1}
.side__g{display:flex;align-items:center;gap:.6rem;padding:.55rem .5rem;font-size:.82rem;font-weight:600;letter-spacing:.02em;color:var(--app-text-muted);border-radius:.5rem}
.side__g .icon{font-size:1rem}
.side__g .chev{margin-left:auto;font-size:.9rem}
.side__user{border-top:1px solid var(--app-border);padding:.8rem 1rem;display:flex;gap:.7rem;align-items:center;font-size:.8rem}
.side__user b{display:block;font-size:.85rem}
.side__user span{color:var(--app-text-muted)}
.side__av{width:32px;height:32px;border-radius:.5rem;background:var(--app-band);display:grid;place-items:center;color:var(--app-text-muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{background:var(--app-surface);border-bottom:1px solid var(--app-border);display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.5rem 1rem;min-height:68px}
.topbar__t{display:flex;align-items:center;gap:.5rem}
.topbar__t .icon{color:var(--app-accent);font-size:1.15rem}
.topbar__t h1{font-size:1.25rem;font-weight:650}
.topbar__info{color:var(--app-text-subtle);font-size:.95rem}
.topbar__tools{margin-left:auto;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.fsel{position:relative;display:flex;align-items:center;gap:.5rem;border:1px solid var(--app-border-strong);border-radius:.5rem;padding:.5rem .7rem;min-width:300px;background:var(--app-surface)}
.fsel label{position:absolute;top:-.55rem;left:.6rem;background:var(--app-surface);padding:0 .25rem;font-size:.68rem;color:var(--app-text-muted)}
.fsel span{flex:1;font-size:.85rem}
.btn{display:inline-flex;align-items:center;gap:.45rem;border-radius:.5rem;border:1px solid transparent;padding:.45rem .75rem;font-size:.8rem;font-weight:600;cursor:pointer;background:transparent;white-space:nowrap;transition:.12s}
.btn .icon{font-size:.95rem}
.btn--outline{border-color:var(--app-accent-border);color:var(--app-accent)}
.btn--outline:hover{background:var(--app-accent-soft)}
.btn--ghost{border-color:var(--app-border-strong);color:var(--app-text-muted)}
.btn--ghost:hover{background:var(--app-hover);color:var(--app-text)}
.btn--icon{padding:.35rem;width:32px;height:32px;justify-content:center}
.canvas{padding:1rem;display:flex;flex-direction:column;gap:1.25rem}

.card{background:var(--app-surface);border:1px solid var(--app-border);border-radius:.75rem;box-shadow:var(--app-shadow-card);min-width:0}
.card__head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.75rem 1rem;border-bottom:1px solid var(--app-border);min-height:50px}
.card__head h3{font-size:.9rem;font-weight:650;display:flex;align-items:center;gap:.5rem}
.card__head h3 .icon{color:var(--app-text-muted)}
.card__head .sp{flex:1}
.card__body{padding:1rem}
.tag{border:1px solid var(--app-border);background:var(--app-sunken);border-radius:.5rem;padding:.25rem .6rem;font-size:.75rem;color:var(--app-text-muted)}
.tag b{color:var(--app-text);margin-left:.25rem}
.note{font-size:.74rem;color:var(--app-text-muted)}

/* ===== controles ===== */
.seg{display:inline-flex;background:var(--app-band);border:1px solid var(--app-border);border-radius:.55rem;padding:.15rem;gap:.15rem}
.seg button{border:0;background:transparent;border-radius:.42rem;padding:.28rem .6rem;font-size:.75rem;font-weight:600;color:var(--app-text-muted);cursor:pointer}
.seg button:hover{color:var(--app-text)}
.seg button.is-on{background:var(--app-band-active);color:var(--app-accent);box-shadow:var(--app-shadow-card)}

.chips{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;background:var(--app-accent-soft);border:1px solid var(--app-accent-border);color:var(--app-accent);
  border-radius:999px;padding:.15rem .3rem .15rem .6rem;font-size:.72rem;font-weight:600}
.chip span{color:var(--app-text-muted);font-weight:500}
.chip button{border:0;background:transparent;color:inherit;cursor:pointer;width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0}
.chip button:hover{background:var(--app-accent-border)}
.hint{font-size:.74rem;color:var(--app-text-subtle);display:flex;align-items:center;gap:.4rem}
.linkbtn{border:0;background:transparent;color:var(--app-accent);font-size:.74rem;font-weight:600;cursor:pointer;padding:.15rem .3rem;border-radius:.3rem}
.linkbtn:hover{background:var(--app-accent-soft)}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.75rem}
@media (max-width:1300px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--app-sunken);border:1px solid var(--app-border);border-radius:.65rem;padding:.7rem .8rem;display:flex;flex-direction:column;gap:.25rem;min-width:0}
.kpi__k{display:flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:600;color:var(--app-text-muted)}
.kpi__v{font-size:1.5rem;font-weight:750;letter-spacing:-.02em;line-height:1.15;display:flex;align-items:center;gap:.45rem;min-width:0}
.kpi__v small{font-size:.8rem;font-weight:600;color:var(--app-text-muted)}
.kpi__v .sw{width:10px;height:10px;border-radius:3px;flex:none}
.kpi__d{font-size:.71rem;color:var(--app-text-subtle);display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:.15rem;font-weight:700;border-radius:.3rem;padding:.02rem .3rem;white-space:nowrap}
.delta--up{color:var(--app-accent);background:var(--app-accent-soft)}
.delta--down{color:var(--app-text-muted);background:var(--app-neutral-soft)}
.delta--flat{color:var(--app-text-muted);background:var(--app-neutral-soft)}


svg.chart{display:block;width:100%;overflow:visible}
.lbl{fill:var(--app-text-muted);font-size:11px}
.gridline{stroke:var(--grid);stroke-width:1}
.baseline{stroke:var(--app-border-strong);stroke-width:1}
.hit{fill:transparent;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:center;font-size:.75rem;color:var(--app-text-muted);margin-bottom:.4rem}
.legend button,.legend span{display:inline-flex;align-items:center;gap:.4rem;border:0;background:transparent;padding:.1rem .2rem;border-radius:.3rem;color:inherit}
.legend button{cursor:pointer}
.legend button:hover{background:var(--app-hover);color:var(--app-text)}
.legend button.is-dim{opacity:.4}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;width:16px;border-radius:2px}
.legend i.ln--dash{background:repeating-linear-gradient(90deg,var(--app-text) 0 4px,transparent 4px 7px)!important}
.legend i.band{width:16px;height:10px;border-radius:2px;border:1px solid var(--app-border-strong);background:var(--app-hover)}

/* tooltip */
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--app-surface);border:1px solid var(--app-border);border-radius:.55rem;
  box-shadow:var(--app-shadow-raised);padding:.5rem .65rem;font-size:.76rem;min-width:170px;display:none}
.tip.is-on{display:block}
.tip__t{font-size:.7rem;color:var(--app-text-subtle);font-weight:650;margin-bottom:.25rem}
.tip__r{display:flex;align-items:center;gap:.6rem;justify-content:space-between}
.tip__r span{display:flex;align-items:center;gap:.4rem;color:var(--app-text-muted)}
.tip__r b{font-variant-numeric:tabular-nums;color:var(--app-text)}
.tip__k{width:10px;height:3px;border-radius:2px;display:inline-block}
.tip__h{margin-top:.35rem;padding-top:.3rem;border-top:1px solid var(--app-border);color:var(--app-accent);font-size:.68rem;font-weight:600}



/* ===== Categorias de Empresa · protótipo ===== */
:root{--spark:#3b82f6;--ok:#16a34a;--bad:#dc2626}
html[data-theme="dark"]{--spark:#60a5fa;--ok:#4ade80;--bad:#f87171}
.pi{line-height:1}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--app-text-muted)}
.sp{flex:1}
.num{font-variant-numeric:tabular-nums}

/* sidebar */
.side__nav{gap:.1rem;overflow:auto}
.nv__g{display:flex;align-items:center;gap:.6rem;padding:.55rem .5rem;font-size:.8rem;font-weight:650;letter-spacing:.02em;color:var(--app-text-muted);border-radius:.5rem}
.nv__g .pi{font-size:.95rem}
.nv__g .chev{margin-left:auto;font-size:.75rem}
.nv__g.is-act{color:var(--app-accent)}
.nv__sub{display:flex;flex-direction:column;gap:.1rem;margin:.1rem 0 .45rem .6rem}
.nv__i{display:flex;align-items:center;gap:.6rem;font-size:.82rem;font-weight:550;color:var(--app-text);padding:.45rem .6rem;border-radius:.45rem;cursor:pointer;text-decoration:none}
.nv__i .pi{font-size:.9rem;color:var(--app-text-muted)}
.nv__i:hover{background:var(--app-hover)}
.nv__i.is-on{background:var(--app-accent-soft);color:var(--app-accent);box-shadow:inset 0 0 0 1px var(--app-accent-border)}
.nv__i.is-on .pi{color:var(--app-accent)}
.new{font-style:normal;font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--app-accent-fill);color:#fff;border-radius:999px;padding:.08rem .4rem;margin-left:auto}

/* topo */
.topbar__t .pi{color:var(--app-accent);font-size:1.15rem}
.topbar__t .topbar__info{color:var(--app-text-subtle);font-size:.95rem}
.search{display:flex;align-items:center;gap:.45rem;border:1px solid var(--app-border-strong);border-radius:.5rem;padding:0 .6rem;height:34px;background:var(--app-surface);min-width:220px}
.search .pi{color:var(--app-text-subtle);font-size:.85rem}
.search input{border:0;outline:0;background:transparent;color:var(--app-text);font:inherit;font-size:.82rem;flex:1;min-width:0}
.search:focus-within{border-color:var(--app-accent);box-shadow:0 0 0 3px var(--app-accent-soft)}
.search--top{min-width:300px;height:40px}
.fsel{min-width:240px}
.fsel .pi{color:var(--app-text-muted)}
.btn .pi{font-size:.85rem}
.btn--primary{background:var(--app-accent-fill);color:#fff;border-color:var(--app-accent-fill)}
.btn--primary:hover{filter:brightness(1.08)}
.btn--danger{background:var(--app-danger);color:#fff;border-color:var(--app-danger)}
.btn--ghost.btn--icon .pi{font-size:.9rem}

/* cabeçalho de seção */
.sech{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.sech h2{display:flex;align-items:center;gap:.5rem;font-size:1rem;font-weight:750}
.sech h2 .pi{color:var(--app-text-muted)}
.linkbtn{display:inline-flex;align-items:center;gap:.25rem}

/* cards de categoria (coloridos, clicáveis) */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.85rem}
.ccard{--c:var(--app-accent);display:flex;flex-direction:column;gap:.25rem;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:.9rem 1rem;border-radius:.8rem;
  background:color-mix(in srgb,var(--c) 13%,var(--app-surface));border:1px solid color-mix(in srgb,var(--c) 50%,transparent);transition:transform .12s,box-shadow .12s,opacity .12s,background .12s}
.ccard:hover{background:color-mix(in srgb,var(--c) 19%,var(--app-surface));box-shadow:var(--app-shadow-raised);transform:translateY(-1px)}
.ccard.is-on{background:color-mix(in srgb,var(--c) 24%,var(--app-surface));border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
.ccard.is-dim{opacity:.5}.ccard.is-dim:hover{opacity:1}
.ccard--all{--c:var(--app-text-muted);background:var(--app-surface);border-color:var(--app-border)}
.ccard--all:hover{background:var(--app-hover)}
.ccard--all.is-on{background:var(--app-surface);border-color:var(--app-accent);box-shadow:0 0 0 2px var(--app-accent-soft)}
.ccard__h{display:flex;align-items:center;gap:.7rem;margin-bottom:.35rem}
.ccard__ico{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--c);color:#fff;font-size:1.05rem}
.ccard--all .ccard__ico{background:var(--app-band);color:var(--app-text)}
.ccard__t{flex:1;min-width:0}
.ccard__t b{display:block;font-size:.84rem;font-weight:800;letter-spacing:.02em;color:color-mix(in srgb,var(--c) 72%,var(--app-text));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard--all .ccard__t b{color:var(--app-text)}
.ccard__t span{font-size:.72rem;color:var(--app-text-muted)}
.ccard__x{color:color-mix(in srgb,var(--c) 72%,var(--app-text));font-size:.85rem}
.ccard__k{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--app-text-muted)}
.ccard__v{font-size:1.75rem;font-weight:800;line-height:1.05;letter-spacing:-.02em;color:color-mix(in srgb,var(--c) 72%,var(--app-text))}
.ccard--all .ccard__v{color:var(--app-text)}
.ccard__row{display:flex;gap:.55rem;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;font-size:.68rem;color:var(--app-text-muted);align-items:baseline}
.ccard__row b{font-weight:700}
.ccard__row--f{border-top:1px solid color-mix(in srgb,var(--c) 25%,transparent);padding-top:.4rem;margin-top:.2rem}
.ccard__row--f b{color:var(--app-text)}
.ccard__vr{display:flex;align-items:baseline;gap:.6rem}
.ccard__val{margin-left:auto;font-weight:800;font-size:.86rem;color:var(--app-text);white-space:nowrap}

/* grupos e cards de empresa (neutros, como hoje) */
.grps{display:flex;flex-direction:column;gap:1.3rem;margin-top:.4rem}
.grp{display:flex;flex-direction:column;gap:.7rem}
.grp__h{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.grp__n{font-size:.78rem;color:var(--app-text-muted)}
.grp__t{font-size:.8rem;color:var(--app-text-muted)}
.grp__t b{color:var(--app-text)}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));grid-auto-rows:1fr;gap:.9rem}
.co{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:.8rem;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:1rem;border-radius:.75rem;
  background:var(--app-surface);border:1px solid var(--app-border);box-shadow:var(--app-shadow-card);transition:.12s}
.co:hover{border-color:var(--app-accent-border);box-shadow:var(--app-shadow-raised)}
.co__wm{position:absolute;right:10px;top:38px;font-size:4.6rem;font-weight:900;letter-spacing:-.04em;color:var(--app-text);opacity:.035;pointer-events:none;line-height:1}
.co__h{display:flex;gap:.8rem;align-items:flex-start}
.co__t{flex:1;min-width:0}
.co__t b{display:block;font-size:.86rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co__t>span{display:block;font-size:.68rem;color:var(--app-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15rem;text-transform:uppercase}
.co__av{display:flex;flex-direction:column;align-items:flex-end;font-size:.7rem;color:var(--app-text-muted);white-space:nowrap}
.co__av b{font-weight:700}
.co__s{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.co__s small{display:block;font-size:.66rem;font-weight:650;letter-spacing:.05em;color:var(--app-text-muted)}
.co__s b{font-size:1.3rem;font-weight:800}
.co__f{display:flex;align-items:flex-end;gap:1rem;margin-top:auto}
.spark{flex:1;height:34px;min-width:0}
.co__v{text-align:right;white-space:nowrap}
.co__v b{display:block;font-size:1.05rem;font-weight:800}
.co__v small{font-size:.7rem;font-weight:650}
.co__v small .pi{font-size:.6rem}

/* chip de categoria */
.cchip{--c:#8395AD;display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:750;letter-spacing:.02em;padding:.22rem .55rem;border-radius:.35rem;white-space:nowrap;
  color:color-mix(in srgb,var(--c) 75%,var(--app-text));background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.cchip .pi{font-size:.85rem;color:var(--c)}
.cchip--big{font-size:.84rem;padding:.32rem .7rem}

/* tabela do cadastro */
.tcard{overflow:hidden}
.tcard .card__head h3 .pi{color:var(--app-text-muted)}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:.84rem}
.tb th{background:var(--app-band);color:var(--app-text);text-align:left;font-weight:700;font-size:.8rem;padding:.7rem .75rem;white-space:nowrap}
.tb th.is-sort{cursor:pointer;user-select:none}
.tb th.is-on{background:color-mix(in srgb,var(--app-accent) 14%,var(--app-band))}
.srt{margin-left:.4rem;font-size:.75rem;color:var(--app-text-subtle)}
.tb td{padding:.6rem .75rem;border-bottom:1px solid var(--app-border);white-space:nowrap;vertical-align:middle}
.tb tbody tr:hover td{background:var(--app-hover)}
.tb td.desc{white-space:normal;min-width:260px;max-width:520px}
.tb .r{text-align:right}.tb .b{font-weight:700}
.cpy{border:0;background:transparent;color:var(--app-accent);cursor:pointer;margin-left:.45rem;padding:.15rem;border-radius:.3rem;vertical-align:middle}
.cpy:hover{background:var(--app-accent-soft)}
.stpill{display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:650;padding:.2rem .6rem;border-radius:999px;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent)}
.stpill i{width:7px;height:7px;border-radius:999px;background:currentColor}
.stpill.is-off{color:var(--app-text-muted);background:var(--app-neutral-soft);border-color:var(--app-border-strong)}
.acts{display:flex;gap:.35rem;justify-content:flex-end}
.ab{width:34px;height:34px;border-radius:.45rem;border:0;display:grid;place-items:center;cursor:pointer;background:var(--app-accent-fill);color:#fff}
.ab:hover{filter:brightness(1.1)}
.ab--ghost{background:var(--app-band);color:var(--app-text-muted)}
.ab--del{background:var(--app-danger)}
.tfoot{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;font-size:.8rem;color:var(--app-text-muted)}
.tfoot b{color:var(--app-text)}
.warnpill{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;font-weight:650;color:var(--app-warning);background:var(--app-warning-soft);border:1px solid var(--app-warning-border);border-radius:999px;padding:.2rem .6rem;margin-right:.4rem}
.empty{padding:1.6rem;text-align:center;color:var(--app-text-muted);font-size:.85rem}

/* diálogos */
.ov{position:fixed;inset:0;z-index:70;background:rgb(5 10 20 / .55);display:grid;place-items:center;padding:1rem;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mdl{width:min(640px,100%);max-height:calc(100vh - 2rem);display:flex;flex-direction:column;background:var(--app-surface);border:1px solid var(--app-border);border-radius:.9rem;box-shadow:var(--app-shadow-raised)}
.mdl--wide{width:min(820px,100%)}
.mdl__h{display:flex;align-items:center;padding:1.1rem 1.4rem .6rem}
.mdl__h h2{font-size:1.15rem;font-weight:750;flex:1}
.mdl__b{padding:.6rem 1.4rem 1rem;overflow:auto}
.mdl__f{display:flex;align-items:center;gap:.6rem;padding:.9rem 1.4rem 1.2rem;justify-content:flex-end}
.x{border:0;background:transparent;color:var(--app-text-muted);cursor:pointer;width:32px;height:32px;border-radius:.45rem;display:grid;place-items:center}
.x:hover{background:var(--app-hover);color:var(--app-text)}
.frm__sec{border:1px solid var(--app-border);border-radius:.75rem;padding:1rem;display:flex;flex-direction:column;gap:.85rem;background:var(--app-sunken)}
.frm__t{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.88rem;padding-bottom:.6rem;border-bottom:1px solid var(--app-border)}
.frm__t .pi{color:var(--app-accent)}
.frm__row{display:grid;grid-template-columns:150px 1fr;gap:.8rem;align-items:end}
.frm__div{height:1px;background:var(--app-border)}
.frm__l{font-size:.78rem;font-weight:650;color:var(--app-text-muted)}
.fl{position:relative;display:flex;flex-direction:column;gap:.25rem;flex:1}
.fl__l{position:absolute;top:-.5rem;left:.6rem;background:var(--app-sunken);padding:0 .3rem;font-size:.68rem;color:var(--app-text-muted);z-index:1}
.fl__hint{font-size:.68rem;color:var(--app-text-subtle)}
.in{width:100%;border:1px solid var(--app-border-strong);background:var(--app-surface);color:var(--app-text);border-radius:.5rem;padding:.7rem .75rem;font:inherit;font-size:.86rem;outline:0;resize:vertical}
.in:focus{border-color:var(--app-accent);box-shadow:0 0 0 3px var(--app-accent-soft)}
.in:disabled{opacity:.7}
.in.is-err{border-color:var(--app-danger)}
.stbox{display:flex;align-items:center;gap:.7rem;border:1px solid var(--app-border-strong);border-radius:.5rem;padding:.55rem .8rem;background:var(--app-surface);font-size:.84rem;color:var(--app-text-muted)}
.tgl{width:44px;height:24px;border-radius:999px;border:0;background:var(--app-border-strong);position:relative;cursor:pointer;padding:0}
.tgl i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;transition:.15s}
.tgl.is-on{background:var(--app-accent-fill)}
.tgl.is-on i{left:23px}
.colrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:.4rem;border:1px solid var(--app-border-strong);cursor:pointer}
.sw.is-empty{background:repeating-linear-gradient(45deg,var(--app-band) 0 4px,transparent 4px 8px)!important}
.cin{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.hex{font-size:.82rem;color:var(--app-text);min-width:64px}
.presets{display:flex;gap:.3rem}
.pre{width:20px;height:20px;border-radius:999px;border:2px solid var(--app-surface);box-shadow:0 0 0 1px var(--app-border-strong);cursor:pointer;padding:0}
.pre:hover{transform:scale(1.15)}
.icorow{position:relative;display:flex;align-items:center;gap:.6rem}
.icorow .btn--icon{width:42px;height:42px;font-size:1rem}
.ipop{position:absolute;right:0;bottom:calc(100% + 8px);width:370px;z-index:5;background:var(--app-surface);border:1px solid var(--app-border);border-radius:.7rem;box-shadow:var(--app-shadow-raised);padding:.7rem;display:flex;flex-direction:column;gap:.5rem}
.ipop .search{min-width:0}
.ipg{display:grid;grid-template-columns:repeat(6,1fr);gap:.2rem;max-height:280px;overflow:auto}
.ipi{height:44px;border:0;background:transparent;color:var(--app-text);border-radius:.4rem;cursor:pointer;font-size:1.1rem}
.ipi:hover{background:var(--app-hover)}
.ipi.is-on{background:var(--app-accent-soft);color:var(--app-accent)}
.ipc{font-size:.72rem;color:var(--app-text-muted)}
.prev{display:flex;align-items:center;gap:.6rem}

.lk__top{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.lk{display:flex;flex-direction:column;gap:.15rem;max-height:52vh;overflow:auto;border:1px solid var(--app-border);border-radius:.6rem;padding:.3rem}
.lk__r{display:flex;align-items:center;gap:.7rem;border:0;background:transparent;color:inherit;font:inherit;text-align:left;padding:.55rem .6rem;border-radius:.45rem;cursor:pointer}
.lk__r:hover{background:var(--app-hover)}
.lk__r.is-on{background:var(--app-accent-soft)}
.lk__n{flex:1;min-width:0}
.lk__n b{display:block;font-size:.84rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk__n small{font-size:.7rem;color:var(--app-text-muted)}
.lk__cur{display:flex;align-items:center;gap:.4rem;font-size:.72rem}
.ck{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--app-border-strong);background:var(--app-surface);flex:none;display:grid;place-items:center}
.ck.is-on{background:var(--app-accent-fill);border-color:var(--app-accent-fill)}
.ck.is-on::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.tb--mini{margin-top:.8rem}
.tb--mini tfoot td{font-weight:700;background:var(--app-sunken)}
.hist{display:flex;flex-direction:column;gap:.2rem;margin-top:.8rem}
.hist__r{display:flex;gap:.7rem;padding:.5rem .3rem;border-bottom:1px solid var(--app-border)}
.hist__r i{width:8px;height:8px;border-radius:999px;background:var(--app-accent);margin-top:.35rem;flex:none}
.hist__r b{display:block;font-size:.84rem;font-weight:600}
.hist__r small{font-size:.72rem;color:var(--app-text-muted)}
.del{display:flex;gap:1rem;align-items:flex-start}
.del p{margin:0 0 .5rem}
.del__ico{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--app-danger-soft);color:var(--app-danger);font-size:1.2rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--app-text);color:var(--app-surface);padding:.6rem 1rem;border-radius:.6rem;font-size:.8rem;box-shadow:var(--app-shadow-raised);transition:.2s;pointer-events:none;z-index:90;max-width:90vw}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.toast code{font-size:.75rem;opacity:.8}
@media (max-width:900px){.cos{grid-template-columns:1fr}.search--top{min-width:200px}}

/* ===== níveis do painel ===== */
.ccards--lg{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.ccard--lg{padding:1.1rem 1.15rem;gap:.35rem}
.ccard--lg .ccard__ico{width:46px;height:46px;font-size:1.2rem}
.ccard--lg .ccard__t b{font-size:.92rem}
.ccard--lg .ccard__t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard--lg .ccard__v{font-size:2.1rem}
.ccard--lg .ccard__row{font-size:.74rem;gap:.8rem}
.ccard__go{color:color-mix(in srgb,var(--c) 72%,var(--app-text));opacity:.55;font-size:.95rem}
.ccard:hover .ccard__go{opacity:1}
.ccard__n{margin-left:auto}
.srch{padding:.4rem}
.srch__h{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;font-size:.85rem}
.srch__h .pi{color:var(--app-accent)}
.srch__l{display:flex;flex-direction:column}
.srch__r{display:flex;align-items:center;gap:.7rem;border:0;background:transparent;color:inherit;font:inherit;text-align:left;padding:.55rem .6rem;border-radius:.45rem;cursor:pointer;font-size:.84rem}
.srch__r:hover{background:var(--app-hover)}
.crumb{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.84rem;color:var(--app-text-muted)}
.crumb a{color:var(--app-accent);cursor:pointer}
.crumb .pi-chevron-right{font-size:.7rem}
.crumb b{color:var(--app-text)}
.btn--sm{padding:.3rem .6rem;font-size:.76rem}
.hd{--c:var(--app-accent);display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;padding:1rem 1.2rem;border-left:5px solid var(--c);
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,var(--app-surface)),var(--app-surface) 55%)}
.hd--all{--c:var(--app-text-muted)}
.hd__t{display:flex;align-items:center;gap:.8rem;min-width:260px}
.hd__t .ccard__ico{width:48px;height:48px;font-size:1.25rem;background:var(--c)}

.hd__t h2{font-size:1.15rem;font-weight:800;letter-spacing:.02em;color:color-mix(in srgb,var(--c) 72%,var(--app-text))}
.hd--all .hd__t h2{color:var(--app-text)}
.hd__ks{display:flex;gap:1.6rem;flex-wrap:wrap;margin-left:auto}
.hd__k small{display:block;font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--app-text-muted)}
.hd__k b{font-size:1.2rem;font-weight:800}
.hd__k:first-child b{font-size:1.6rem;color:color-mix(in srgb,var(--c) 72%,var(--app-text))}
.hd--all .hd__k:first-child b{color:var(--app-text)}
.sib{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.sib__b{--c:var(--app-accent);display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--app-border-strong);background:var(--app-surface);color:var(--app-text);border-radius:999px;padding:.3rem .75rem;font:inherit;font-size:.74rem;font-weight:650;cursor:pointer}
.sib__b .pi{color:var(--c);font-size:.8rem}
.sib__b em{font-style:normal;font-size:.68rem;color:var(--app-text-muted)}
.sib__b:hover{border-color:var(--c)}
.sib__b.is-on{background:color-mix(in srgb,var(--c) 16%,var(--app-surface));border-color:var(--c);color:color-mix(in srgb,var(--c) 70%,var(--app-text))}
.co__cat{margin-top:.4rem}
.co__cat .cchip{font-size:.64rem;padding:.12rem .4rem}
.co.is-flash{border-color:var(--app-accent);box-shadow:0 0 0 3px var(--app-accent-soft)}

/* disponível / indisponível em destaque */
.av2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.35rem 0 .1rem}
.av2__b{--k:var(--ok);display:flex;flex-direction:column;gap:.05rem;padding:.5rem .65rem;border-radius:.55rem;
  background:color-mix(in srgb,var(--k) 12%,var(--app-surface));border:1px solid color-mix(in srgb,var(--k) 45%,transparent)}
.av2__b--bad{--k:var(--bad)}
.av2__b small{display:flex;align-items:center;gap:.3rem;font-size:.64rem;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--k)}
.av2__b small .pi{font-size:.72rem}
.av2__b b{font-size:1.3rem;font-weight:800;line-height:1.1;color:var(--k)}
.av2__b em{font-style:normal;font-size:.68rem;color:var(--app-text-muted)}
.ccard--lg .av2__b b{font-size:1.4rem}
.hd__k b.av{font-size:1.5rem}

/* ===== nível 1: cards de categoria no padrão das categorias de área (cor só no detalhe) ===== */
.kcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:1.1rem}
@media (max-width:1500px){.kcs{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}}
.kc{--c:var(--app-accent);display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:0;overflow:hidden;
  background:var(--app-surface);border:1px solid var(--app-border);border-top:3px solid var(--c);border-radius:.8rem;box-shadow:var(--app-shadow-card);transition:box-shadow .15s,transform .15s,border-color .15s}
.kc:hover{box-shadow:var(--app-shadow-raised)}
.kc--all{--c:var(--app-text-muted)}
.kc__h{display:flex;align-items:flex-start;gap:.85rem;padding:1.2rem 1.25rem .9rem}
.kc__ico{width:48px;height:48px;border-radius:.65rem;display:grid;place-items:center;flex:none;font-size:1.25rem;color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.kc--all .kc__ico{color:var(--app-text);background:var(--app-band);border-color:var(--app-border-strong)}
.kc__t{flex:1;min-width:0}
.kc__t b{display:block;font-size:1.08rem;font-weight:800;letter-spacing:.02em;line-height:1.25}
.kc__t span{display:block;font-size:.78rem;color:var(--app-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15rem}
.kc__pill{font-size:.76rem;color:var(--app-text-muted);white-space:nowrap;border:1px solid var(--app-border-strong);background:var(--app-sunken);border-radius:999px;padding:.2rem .6rem}
.kc__pill b{color:var(--app-text)}
.kc__box{margin:0 1.25rem;padding:1rem 1.1rem;background:var(--app-sunken);border:1px solid var(--app-border);border-radius:.7rem;display:flex;flex-direction:column;gap:.35rem}
.kc__k{display:flex;align-items:center;gap:.45rem;font-size:.7rem;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--app-text-muted)}
.kc__vr{display:flex;align-items:baseline;gap:.8rem}
.kc__v{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.kc__v small{font-size:.82rem;font-weight:500;color:var(--app-text-muted);margin-left:.4rem;letter-spacing:0}
.kc__val{margin-left:auto;font-size:1.1rem;font-weight:800;color:var(--app-accent);white-space:nowrap}
.kc__share{display:flex;align-items:center;gap:.7rem;font-size:.74rem;color:var(--app-text-muted);margin-top:.3rem}
.kc__trk{flex:1;height:7px;border-radius:4px;background:var(--app-neutral-soft);overflow:hidden}
.kc__trk i{display:block;height:100%;border-radius:4px;background:var(--c)}
.av2--lg{margin:.9rem 1.25rem 1.1rem;gap:.7rem}
.av2--lg .av2__b{padding:.75rem .9rem}
.av2--lg .av2__b small{font-size:.7rem}
.av2--lg .av2__b b{font-size:1.65rem}
.av2--lg .av2__b em{font-size:.72rem}
.kc__f{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;border-top:1px solid var(--app-border);background:var(--app-sunken);font-size:.78rem;color:var(--app-text-muted)}
.kc__go{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;color:var(--app-accent);font-size:.84rem}
.kc__f:hover .kc__go .pi{transform:translateX(3px)}
.kc__go .pi{transition:transform .15s}

/* nível 2: cabeçalho no mesmo padrão (sem preencher o card) */
.hd{background:var(--app-surface);border-left:1px solid var(--app-border);border-top:3px solid var(--c)}
.hd__t .ccard__ico{border-radius:.65rem;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.hd__t h2{color:var(--app-text)}
.hd__k:first-child b{color:var(--app-text)}

/* ===== blocos Disponível / Indisponível clicáveis ===== */
.kc:focus-visible,.co:focus-visible{outline:2px solid var(--app-accent);outline-offset:2px}
.av2__b--go{font:inherit;text-align:left;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s,transform .12s}
.av2__b--go:hover{background:color-mix(in srgb,var(--k) 20%,var(--app-surface));border-color:var(--k);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 18%,transparent);transform:translateY(-1px)}
.av2__b--go:focus-visible{outline:2px solid var(--k);outline-offset:2px}
.av2__ft{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.av2__go{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:750;color:var(--k);opacity:.55;white-space:nowrap;transition:opacity .12s}
.av2__go .pi{font-size:.7rem;transition:transform .12s}
.av2__b--go:hover .av2__go{opacity:1}
.av2__b--go:hover .av2__go .pi{transform:translateX(3px)}
.hd__k--go{border:1px solid transparent;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:.55rem;padding:.25rem .6rem;margin:-.25rem -.6rem}
.hd__k--go small{display:flex!important;align-items:center;gap:.35rem}
.hd__k--go small .pi{font-size:.62rem;opacity:.5;transition:transform .12s,opacity .12s}
.hd__k--go.is-ok:hover{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.hd__k--go.is-bad:hover{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.hd__k--go:hover small .pi{opacity:1;transform:translateX(2px)}
.co__ag{color:inherit;cursor:pointer;border-radius:.3rem;padding:.05rem .3rem;margin-right:-.3rem}
.co__ag:hover{background:var(--app-hover);text-decoration:underline;text-underline-offset:2px}

/* ===== itens disponíveis / indisponíveis: destaque do que está sendo visto ===== */
.ib{--k:var(--bad);border:1px solid color-mix(in srgb,var(--k) 45%,var(--app-border));border-left:6px solid var(--k);overflow:hidden}
.ib--ok{--k:var(--ok)}
.ib__top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 1.2rem;background:linear-gradient(90deg,color-mix(in srgb,var(--k) 16%,var(--app-surface)),var(--app-surface) 70%)}
.ib__ico{width:52px;height:52px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--k);color:#fff;font-size:1.5rem;box-shadow:0 0 0 5px color-mix(in srgb,var(--k) 20%,transparent)}
.ib__t{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.ib__t>small{font-size:.66rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--app-text-muted)}
.ib__t h2{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;font-size:1.3rem;font-weight:800;line-height:1.2}
.ib__st{color:var(--k);text-transform:uppercase;letter-spacing:.02em}
.ib__de{font-weight:600;color:var(--app-text-muted);font-size:1rem}
.ib__sw{display:inline-flex;background:var(--app-band);border:1px solid var(--app-border);border-radius:.6rem;padding:.2rem;gap:.2rem}
.ib__sb{--k:var(--ok);display:inline-flex;align-items:center;gap:.4rem;border:1px solid transparent;background:transparent;border-radius:.45rem;padding:.4rem .75rem;font:inherit;font-size:.8rem;font-weight:650;color:var(--app-text-muted);cursor:pointer}
.ib__sb--bad{--k:var(--bad)}
.ib__sb .pi{color:var(--k);font-size:.85rem}
.ib__sb b{font-weight:800;color:var(--app-text)}
.ib__sb:hover{color:var(--app-text)}
.ib__sb.is-on{background:color-mix(in srgb,var(--k) 16%,var(--app-surface));border-color:var(--k);color:var(--k);cursor:default}
.ib__sb.is-on b{color:var(--k)}
.ib__ks{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:.75rem;padding:.9rem 1.2rem 1.1rem;border-top:1px solid var(--app-border)}
@media (max-width:1100px){.ib__ks{grid-template-columns:1fr 1fr}}
.ik{display:flex;flex-direction:column;gap:.2rem;padding:.7rem .85rem;border-radius:.65rem;background:var(--app-sunken);border:1px solid var(--app-border);min-width:0}
.ik small{display:flex;align-items:center;gap:.4rem;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--app-text-muted)}
.ik b{font-size:1.45rem;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.ik em{font-style:normal;font-size:.72rem;color:var(--app-text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ik--main{background:color-mix(in srgb,var(--k) 10%,var(--app-surface));border-color:color-mix(in srgb,var(--k) 45%,transparent)}
.ik--main small,.ik--main b{color:var(--k)}
.ik--main b{font-size:1.75rem}
.crumb__chip{display:inline-flex}
.crumb b.ok{color:var(--ok)}.crumb b.bad{color:var(--bad)}

/* filtros (mesmo padrão da Área de controle) */
.fb{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.65rem .9rem}
.fb .sp{flex:1}
.fb__g{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.fb__l{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;color:var(--app-text-muted);margin-right:.2rem;text-transform:uppercase;letter-spacing:.04em}
.fb__l .pi{font-size:.75rem}
.fb__div{width:1px;height:26px;background:var(--app-border)}
.fb__res{font-size:.78rem;color:var(--app-text-muted)}
.fb__res b{color:var(--app-text)}
.fc{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--app-border-strong);background:var(--app-surface);color:var(--app-text);border-radius:.45rem;padding:.25rem .55rem;font:inherit;font-size:.76rem;font-weight:650;cursor:pointer}
.fc em{font-style:normal;font-weight:500;color:var(--app-text-subtle);font-size:.7rem}
.fc:hover{border-color:var(--app-accent-border)}
.fc.is-on{background:var(--app-accent-soft);border-color:var(--app-accent);color:var(--app-accent)}
.fc.is-on em{color:var(--app-accent)}
.fc.is-zero{opacity:.45}
.fc__sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--app-border-strong);vertical-align:-1px}
.fsel2{height:30px;max-width:260px;border:1px solid var(--app-border-strong);border-radius:.45rem;background:var(--app-surface);color:var(--app-text);padding:0 .5rem;font:inherit;font-size:.76rem;font-weight:650;cursor:pointer}
.fsel2.is-on{border-color:var(--app-accent);background:var(--app-accent-soft);color:var(--app-accent)}
.chip--f{background:var(--app-sunken);border-color:var(--app-border-strong);color:var(--app-text)}

/* mestre-detalhe */
.md{display:grid;grid-template-columns:minmax(280px,330px) minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:1000px){.md{grid-template-columns:1fr}}
.pm{position:sticky;top:12px}
.pm__list{display:flex;flex-direction:column;padding:.4rem}
.pm__sep{height:1px;background:var(--app-border);margin:.3rem .4rem}
.pl{display:grid;grid-template-columns:30px minmax(0,1fr) auto 14px;grid-template-areas:"i t v g" "i b b g" "i p p g";gap:.15rem .7rem;align-items:center;text-align:left;font:inherit;color:inherit;
  border:0;border-left:3px solid transparent;background:transparent;border-radius:.45rem;padding:.6rem .6rem .6rem .55rem;cursor:pointer}
.pl:hover{background:var(--app-hover)}
.pl.is-on{background:var(--app-accent-soft);border-left-color:var(--app-accent)}
.pl.is-zero{opacity:.45}
.pl__ico{grid-area:i;width:30px;height:30px;border-radius:.45rem;display:grid;place-items:center;background:var(--app-band);color:var(--app-text-muted);font-size:.9rem}
.pl.is-on .pl__ico{background:var(--app-accent-fill);color:#fff}
.pl__t{grid-area:t;min-width:0}
.pl__t b{display:block;font-size:.78rem;font-weight:750;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl__t small{font-size:.68rem;color:var(--app-text-subtle)}
.pl__v{grid-area:v;text-align:right}
.pl__v b{display:block;font-size:.95rem;font-weight:800}
.pl__v small{font-size:.68rem;color:var(--app-text-muted)}
.pl__bar{grid-area:b;height:4px;background:var(--app-neutral-soft);border-radius:2px;overflow:hidden;margin-top:.15rem}
.pl__bar i{display:block;height:100%;background:var(--app-text-muted);border-radius:2px}
.pl.is-on .pl__bar i{background:var(--app-accent)}
.pl__pc{grid-area:p;font-size:.66rem;color:var(--app-text-subtle)}
.pl__go{grid-area:g;color:var(--app-text-subtle);font-size:.7rem}
.pl.is-on .pl__go{color:var(--app-accent)}
.pt{overflow:hidden;min-width:0}
.pt .card__head .seg button{padding:.3rem .65rem}
.pt__bar{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;border-bottom:1px solid var(--app-border);background:var(--app-sunken)}
.pt__bar .sp{flex:1}
.pt__bar .note b{color:var(--app-text)}
.stt{--k:var(--bad);display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:750;text-transform:uppercase;letter-spacing:.04em;padding:.15rem .5rem;border-radius:999px;color:var(--k);
  background:color-mix(in srgb,var(--k) 13%,transparent);border:1px solid color-mix(in srgb,var(--k) 45%,transparent)}
.stt--ok{--k:var(--ok)}
.stt .pi{font-size:.7rem}
.tb--it{font-size:.8rem}
.tb--it th{padding:.6rem .6rem;font-size:.76rem}
.tb--it td{padding:.5rem .6rem}
.tb--it tbody tr{cursor:pointer}
.tb--it tbody tr.is-sel td{background:var(--app-accent-soft)}
.tb--it tfoot td{font-weight:700;background:var(--app-sunken);border-bottom:0;padding:.6rem}
.tb--it .c-ck{width:34px}
.tb--it .c-co{max-width:170px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tb--it td.ok{color:var(--ok)}.tb--it td.bad{color:var(--bad)}
.tb--it .empty{text-align:center;white-space:normal}
.ck--b{cursor:pointer;padding:0}
.plink{color:var(--app-accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.tb td .fc__sw{margin-right:.15rem}
.pg{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.7rem 1rem;font-size:.8rem;color:var(--app-text-muted);border-top:1px solid var(--app-border)}
.pg b{color:var(--app-text)}
.pg .sp{flex:1}
.pg__nav{display:flex;gap:.2rem;align-items:center}
.pg__nav button{min-width:30px;height:30px;border-radius:999px;border:0;background:transparent;color:var(--app-text-muted);cursor:pointer;font-size:.78rem;display:grid;place-items:center;font-family:inherit}
.pg__nav button:hover{background:var(--app-hover);color:var(--app-text)}
.pg__nav button.is-on{background:var(--app-accent-soft);color:var(--app-accent);font-weight:700}
.pg__nav button:disabled{opacity:.35;cursor:default}
.pg__gap{padding:0 .2rem}
.pg__per{height:32px;border:1px solid var(--app-border-strong);border-radius:.45rem;background:var(--app-surface);color:var(--app-text);padding:0 .5rem;font:inherit;font-size:.8rem}
/* telas até 1500px: categorias de produto viram uma faixa acima da tabela (tabela com largura total) */
@media (max-width:1500px){
  .md{grid-template-columns:1fr}
  .pm{position:static}
  .pm__list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.35rem}
  .pm__sep{display:none}
  .pl{border-left:0;border:1px solid var(--app-border);padding:.5rem .55rem}
  .pl.is-on{border-color:var(--app-accent)}
  .pl__go{display:none}
  .pm__list{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
  .pl{grid-template-columns:28px minmax(0,1fr);grid-template-areas:"i t" "i v" "b b" "p p";gap:.1rem .55rem}
  .pl__ico{width:28px;height:28px}
  .pl__t small{display:none}
  .pl__v{text-align:left;display:flex;align-items:baseline;gap:.45rem}
  .pl__v b{display:inline}
  .pl__bar{margin-top:.35rem}
  .pl__t b{white-space:normal;font-size:.72rem;line-height:1.2}
  .pl__v small{white-space:nowrap}
  .pl{align-items:start}
}

/* ===== botões do card de categoria: Estoque (enxoval) e Ver empresas ===== */
.kc{cursor:default}
button.kc__box{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .12s,box-shadow .12s,background .12s,transform .12s}
button.kc__box:hover{border-color:var(--app-accent);background:color-mix(in srgb,var(--app-accent) 6%,var(--app-sunken));box-shadow:0 0 0 3px var(--app-accent-soft);transform:translateY(-1px)}
button.kc__box:focus-visible{outline:2px solid var(--app-accent);outline-offset:2px}
.kc__en{margin-left:auto;display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:750;letter-spacing:0;text-transform:none;color:var(--app-accent);opacity:.6;transition:opacity .12s}
.kc__en .pi{font-size:.7rem;transition:transform .12s}
button.kc__box:hover .kc__en{opacity:1}
button.kc__box:hover .kc__en .pi{transform:translateX(3px)}
button.kc__f{width:100%;border:0;border-top:1px solid var(--app-border);font:inherit;cursor:pointer;color:var(--app-accent);background:color-mix(in srgb,var(--app-accent) 7%,var(--app-sunken));padding:.8rem 1.25rem;transition:background .12s}
button.kc__f:hover{background:color-mix(in srgb,var(--app-accent) 16%,var(--app-surface))}
button.kc__f:focus-visible{outline:2px solid var(--app-accent);outline-offset:-2px}
.kc__fl{display:inline-flex;align-items:center;gap:.5rem;font-weight:750;font-size:.88rem}
.kc__fl em{font-style:normal;font-size:.7rem;font-weight:750;min-width:22px;text-align:center;padding:.05rem .4rem;border-radius:999px;background:var(--app-accent-soft);border:1px solid var(--app-accent-border)}
.hd__k--go.is-acc:hover{background:var(--app-accent-soft);border-color:var(--app-accent-border)}
.co__st{color:inherit;cursor:pointer;border-radius:.4rem;padding:.1rem .3rem;margin:-.1rem -.3rem}
.co__st:hover{background:var(--app-hover)}
.co__st:hover b{color:var(--app-accent);text-decoration:underline;text-underline-offset:3px}

/* modo totalizador do enxoval (cor de destaque neutra/azul) */
.ib--tot{--k:var(--app-accent)}

function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);

  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}
function s(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "text") n.textContent = v;

  const raw = max / ticks, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag;

  return { max: Math.ceil(max / step) * step, step: Math.max(1, step) };
}

}

function showTip(e, title, list, hint) {

}
function moveTip(e) {
  const r = tip.getBoundingClientRect(), off = 14;
  let x = e.clientX + off, y = e.clientY + off;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - off;

  tip.style.left = x + "px"; tip.style.top = y + "px";

function bindTip(node, fn) {
  node.addEventListener("pointerenter", (e) => showTip(e, ...fn()));
  node.addEventListener("pointermove", moveTip);
  node.addEventListener("pointerleave", hideTip);
}

/* peso de cada categoria de produto conforme a categoria da empresa [CAMA, PAC, CIR, UNI, BANHO] */
const MIX = { 1: [0.32, 0.25, 0.22, 0.13, 0.08], 2: [0.3, 0.24, 0.24, 0.12, 0.1], 3: [0.55, 0, 0, 0.05, 0.4], 4: [0, 0, 0, 0.92, 0.08], 5: [0.28, 0.18, 0.18, 0.22, 0.14] };
const MIX0 = [0.35, 0.25, 0.1, 0.15, 0.15];
const SZ_ORDER = ["P", "M", "G", "GG", "Único"];
const COR_SW = { BRANCO: "#f4f6f9", AZUL: "#2f6fd6", VERDE: "#1f9d6b", CINZA: "#8a94a6" };
const ST_INFO = {
  total: { k: "tot", ic: "pi-box", field: "qt", tot: "stock", title: "Totalizador do enxoval", sw: "Estoque total", u: "Unidades no enxoval", of: "do enxoval", de: "no enxoval", tt: "Total do enxoval", none: "Nenhum item", with: "com enxoval", tag: "enxoval" },

const coShort = (n) => (n.includes(" - ") ? n.split(" - ")[0] : n);

/* itens (produto × tamanho × cor) de cada empresa, já repartidos em disponível e indisponível */
const ITEM_CACHE = new Map();
function itemsOf(co) {
  const cat = catById(co.catId), mix = (cat && MIX[cat.id]) || MIX0;
  const key = `${co.id}|${mix.join()}|${co.avail}|${co.unav}`;
  if (ITEM_CACHE.has(key)) return ITEM_CACHE.get(key);
  let sd = co.id * 7919 + 17;
  const r = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  const skus = [];
  CATALOG.forEach(([code, pc, name, unit, sizes, colors]) => {
    const w0 = mix[PCATS.findIndex((p) => p.id === pc)];
    if (!w0) return;
    sizes.forEach((sz, si) => colors.forEach((cor, ci) => {
      if (sizes.length > 1 && r() < 0.12) return; /* nem todo tamanho existe em toda empresa */
      const shape = sz === "M" || sz === "G" ? 1.6 : sz === "U" ? 2.2 : 0.8;
      skus.push({ co: co.id, code: code * 10 + si * 2 + ci, cat: pc, name, sz: sz === "U" ? "Único" : sz, cor, unit, wa: shape * (0.35 + r()) * w0, wu: shape * (0.15 + r() * 1.4) * w0 });
    }));
  });
  const split = (total, wk, out) => {
    const W = sum(skus.map((x) => x[wk])); let left = total;
    skus.forEach((x, i) => { x[out] = i === skus.length - 1 ? Math.max(0, left) : Math.min(left, Math.round((total * x[wk]) / W)); left -= x[out]; });
  };

        h("button", { class: "btn btn--ghost", onclick: () => toast("Cadastro de empresa (como hoje), agora com o campo <b>Categoria</b>.") }, pi("pi-plus"), "Nova Empresa"), themeBtn()));
  } else {
    t.replaceChildren(h("div", { class: "topbar__t" }, pi("pi-tags"), h("h1", { text: "Categorias de Empresa" }), pi("pi-info-circle", "topbar__info")),
      h("div", { class: "topbar__tools" }, h("button", { class: "btn btn--primary", onclick: () => dlgEdit(null) }, pi("pi-plus"), "Nova Categoria"), themeBtn()));
  }
}
function themeBtn() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  return h("button", { class: "btn btn--ghost btn--icon", title: "Alternar tema", onclick: () => { document.documentElement.setAttribute("data-theme", dark ? "light" : "dark"); route(); } }, pi(dark ? "pi-sun" : "pi-moon"));
}
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  hideTip();
  renderNav();
  if ((location.hash || "#/painel") === "#/categorias") renderCats(); else renderPainel();
}
addEventListener("hashchange", () => { route(); scrollTo(0, 0); });
route();

</script>
