<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GAO · Rota do dia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>try{if(JSON.parse(localStorage.getItem('gao_theme')||'null')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="static/css/kit.css">
<link rel="stylesheet" href="static/css/app.css">
<link rel="stylesheet" href="static/css/rota.css">
<link rel="stylesheet" href="static/css/gk-app.css">
</head>
<body class="p-rota" data-page="home" data-flow-step="rota">

<div class="app">
  <div class="nav">
    <button class="back" id="backBtn" aria-label="Voltar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div><h1>Sua rota de hoje</h1><p id="navSub">Rota otimizada</p></div>
  </div>

  <section class="view active" id="viewLoading">
    <div class="spinner"></div>
    <h1>Calculando a melhor rota</h1>
    <p>Estamos montando a rota mais curta só com as comandas que você carregou.</p>
  </section>

  <section class="view" id="viewRoute">
    <div class="content">
      <div class="summary">
        <div class="sm"><b id="smStops">—</b><small>Paradas</small></div>
        <div class="sm"><b id="smDist">—</b><small>Distância</small></div>
        <div class="sm"><b id="smTime">—</b><small>Tempo est.</small></div>
      </div>
      <a class="maps-btn" id="mapsBtn" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Abrir rota no Google Maps
      </a>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
</div>

<div class="footer" id="footer">
  <button class="foot-btn" id="startBtn">Iniciar entregas <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
</div>

<div class="sheet-wrap" id="okWrap">
  <div class="sheet">
    <div class="ring"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg></div>
    <h3>Próxima etapa: entregas</h3>
    <p>A tela de confirmar as entregas entra aqui — vamos construir ela em seguida.</p>
    <button id="okBtn">Entendi</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.60.0/dist/umd/lucide.min.js"></script>
<script src="static/js/shell.js"></script>
<script>
  const HUB='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12M3 21h18M9 21v-6h6v6"/></svg>';
  const BOX='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>';
  const INBOX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>';
  const TRUCK=(window.GAO&&GAO.truck)||'';

  /* ---- dados reais: a rota nasce do que foi CARREGADO (gao_cargo), não de uma lista fixa ---- */
  const ADDR={
    'Materno Infantil':'Av. T-9, 1200, Setor Bueno',
    'Hospital Albert Einstein':'Av. Brasil, 850, Centro',
    'Hospital São Marcos':'Rua 84, 420, Setor Sul',
    'SJ Hotel':'Av. Anhanguera, 77, Centro'
  };
  const addrOf=n=>ADDR[n]||'Endereço cadastrado do cliente';
  function ld(k){ try{ return (window.GAO&&GAO.load&&GAO.load(k))||null; }catch(e){ return null; } }
  const ex=ld('gao_active_extra');
  const isExtra=!!(ex&&ex.clientes&&ex.clientes.length);
  const baseNames=isExtra ? ex.clientes.map(c=>c.cliente) : ['Materno Infantil','Hospital Albert Einstein'];
  const cargo=ld('gao_cargo')||[];
  const loaded=baseNames.filter((n,i)=>cargo[i]&&cargo[i].confirmed&&!cargo[i].reported);
  const notLoaded=baseNames.length-loaded.length;
  if(!loaded.length){ window.location.replace('carregar.html'); }   // sem carregamento confirmado não há rota
  // coletas fixas só existem na rota cadastrada; na rota extra elas entram quando registradas durante as entregas
  const coletaNames=isExtra ? [] : ['Hospital São Marcos','SJ Hotel'];
  document.getElementById('navSub').textContent='Rota otimizada, '+((ex&&ex.name)||'Rota Hospitalar')+(notLoaded>0?', '+loaded.length+' de '+baseNames.length+' clientes carregados':'');
  const stops=[{type:'hub', kind:'Partida', name:'GAO Lavanderia', addr:'Saída do centro de distribuição'}]
    .concat(loaded.map(n=>({type:'e', kind:'Entrega', name:n, addr:addrOf(n)})))
    .concat(coletaNames.length?[{phase:'Entregas concluídas. Agora começam as coletas.'}]:[])
    .concat(coletaNames.map(n=>({type:'c', kind:'Coleta', name:n, addr:addrOf(n)})))
    .concat([{type:'hub', kind:'Retorno', name:'GAO Lavanderia', addr:'Devolução no centro de distribuição'}]);
  const nStops=loaded.length+coletaNames.length;
  document.getElementById('smStops').textContent=nStops;
  document.getElementById('smDist').textContent=Math.round(nStops*4.5)+' km';
  (function(){ const mins=Math.round(nStops*17.5), h=Math.floor(mins/60), m=mins%60; document.getElementById('smTime').textContent=h?(h+'h'+String(m).padStart(2,'0')):(m+' min'); })();
  const timeline=document.getElementById('timeline');
  timeline.innerHTML=stops.map(s=>{
    if(s.phase) return `<div class="tl-phase">${TRUCK} ${s.phase}</div>`;
    const ic = s.type==='hub' ? HUB : (s.type==='e' ? BOX : INBOX);
    const kindCls = s.type==='hub'?'h':s.type;
    return `<div class="tl-item">
      <div class="tl-rail"><div class="tl-node ${s.type}">${ic}</div></div>
      <div class="tl-body">
        <div class="tl-kind ${kindCls}">${s.kind}</div>
        <div class="tl-name">${s.name}</div>
        <div class="tl-addr">${s.addr}</div>
      </div>
    </div>`;
  }).join('');

  const dest=stops.filter(s=>!s.phase).map(s=>encodeURIComponent(s.name+' Goiânia'));
  document.getElementById('mapsBtn').href='https://www.google.com/maps/dir/'+dest.join('/');

  const viewLoading=document.getElementById('viewLoading'), viewRoute=document.getElementById('viewRoute'), footer=document.getElementById('footer');
  setTimeout(()=>{
    viewLoading.classList.remove('active');
    viewRoute.classList.add('active');
    footer.classList.add('show');
    window.scrollTo({top:0});
  }, 1800);

  /* As mensagens de "a caminho" saem automaticamente pelo Z-API (número da GAO) ao iniciar as entregas — sem etapa manual aqui. */
  function goEntrega(){ if(window.GAO&&GAO.setTrip){var t=(GAO.getTrip&&GAO.getTrip())||{route:0};t.step='entrega';GAO.setTrip(t);} window.location.href='entrega.html'; }

  document.getElementById('backBtn').addEventListener('click',()=>{window.location.href='carregar.html';});
  const okWrap=document.getElementById('okWrap');
  document.getElementById('startBtn').addEventListener('click',goEntrega);
  document.getElementById('okBtn').addEventListener('click',()=>okWrap.classList.remove('open'));
  okWrap.addEventListener('click',e=>{if(e.target===okWrap)okWrap.classList.remove('open');});
</script>
</body>
</html>
